<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Ferramentas - Uai Animo</title>
    <style>
        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: #eef2f7; /* Fundo levemente azulado/cinza para destacar o painel branco */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background-color: #ffffff;
            padding: 40px 30px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(26, 62, 98, 0.15); /* Sombra com um leve tom do azul da logo */
            text-align: center;
            width: 100%;
            max-width: 400px;
        }
        .logo {
            max-width: 180px; /* Tamanho ajustável da logo */
            height: auto;
            margin-bottom: 20px;
        }
        h1 {
            color: #1a3e62; /* Azul escuro inspirado na logo */
            font-size: 24px;
            margin-bottom: 30px;
            font-weight: 700;
        }
        .btn {
            display: block;
            width: 100%;
            padding: 15px;
            margin-bottom: 15px;
            font-size: 16px;
            font-weight: bold;
            text-decoration: none;
            border-radius: 8px;
            box-sizing: border-box;
            transition: all 0.3s ease;
            cursor: pointer;
        }
        /* Botão Principal (Azul preenchido) */
        .btn-nfc {
            background-color: #1a3e62; 
            color: #ffffff;
            border: 2px solid #1a3e62;
        }
        .btn-nfc:hover {
            background-color: #2c5987;
            border-color: #2c5987;
            transform: translateY(-2px);
            box-shadow: 0 4px 10px rgba(26, 62, 98, 0.3);
        }
        /* Botão Secundário (Branco com contorno Azul) */
        .btn-qr {
            background-color: #ffffff; 
            color: #1a3e62;
            border: 2px solid #1a3e62;
        }
        .btn-qr:hover {
            background-color: #f0f4f8;
            transform: translateY(-2px);
            box-shadow: 0 4px 10px rgba(26, 62, 98, 0.1);
        }
    </style>
</head>
<body>

<div class="container">
    <!-- Logo Uai Animo inserida aqui -->
    <img src="uaianimosemfundo.png" alt="Logo Uai Animo" class="logo">
    
    <h1>Painel de Ferramentas</h1>
    
    <!-- Substitua "gerador.html" pelo nome do seu ficheiro do gerador NFC -->
    <a href="gerador.html" class="btn btn-nfc">⭐ Gerador de Link NFC (Google)</a>
    
    <!-- Substitua "qrcode.html" pelo nome do seu ficheiro do gerador de QR Code -->
    <a href="qrcode.html" class="btn btn-qr">📱 Gerador de QR Code</a>
</div>

</body>
</html>
